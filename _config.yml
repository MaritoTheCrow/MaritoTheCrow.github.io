remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
title: MCB Advisor
description: "Advising in Corporate Finance issues to your company. Valuations, Investment Projects and Financial analysis. Restructuring and Due Diligence"
subtitle: "Advising in Corporate Finance issues to your company. Valuations, Investment Projects and Financial analysis. Restructuring and Due Diligence"
url: "https://mcbadvisor.com"
# Profile block headshot only (suit portrait). Not Logo.png. Change path if you upload e.g. /portrait.jpg
profile_image: "/Gemini_Generated 1.png"
contact_form_email: "mcbadvisor@gmail.com"

# One page per ticker, generated from _data/merval/tickers.yml by tools/sync_ticker_pages.py
collections:
  merval:
    output: true
    permalink: /valuations/merval/:name/
  merval_es:
    output: true
    permalink: /es/valuations/merval/:name/

defaults:
  - scope: { path: "", type: merval }
    values: { layout: ticker, lang: en }
  - scope: { path: "", type: merval_es }
    values: { layout: ticker, lang: es }

exclude:
  - venv
  - tools
  - Gemfile
  - Gemfile.lock
  - README.md
